<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Contador adaptable</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;
    }

    #contenedor {
      width: 100%;
      height: 100%;

      padding: 8px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    #contador {
      display: flex;
      align-items: baseline;
      justify-content: center;

      gap: 12px;

      line-height: 1;
      white-space: nowrap;

      transform-origin: center center;

      transition:
        color 0.45s ease-in-out,
        transform 0.25s ease-in-out;
    }

    #valor {
      font-weight: 800;
      letter-spacing: -1.5px;

      text-shadow:
        2px 3px 8px rgba(0, 0, 0, 0.16);
    }

    #unidad {
      font-weight: 700;
      letter-spacing: -0.4px;

      opacity: 0.95;

      text-shadow:
        1px 2px 5px rgba(0, 0, 0, 0.12);
    }
  </style>
</head>

<body>

  <div id="contenedor">
    <div id="contador">
      <span id="valor">0</span>
      <span id="unidad"></span>
    </div>
  </div>

  <script>
    /*
     * ==========================================================
     * CONFIGURACIÓN DE UNIDADES E IDs
     * ==========================================================
     *
     * Añade cada nueva ID dentro de su unidad correspondiente.
     *
     * IDs incluidos en "L/km":
     * - Se dividen entre 10.000.
     * - Se muestran con 4 decimales.
     *
     * Resto de IDs:
     * - Se dividen entre 100.
     * - Se muestran con 2 decimales.
     */
    const simbolosConfig = {
      "%": [
        46, 45, 29, 28, 27, 17, 16, 15, 2, 1
      ],

      "kWh": [
        44, 43, 40, 39, 34, 33, 22, 21, 11, 10
      ],

      "m³/persona": [
        9, 41, 42
      ],

      "L/100 Tm": [
        31, 19, 5
      ],

      "kg": [
        8
      ],

      /*
       * Añade aquí todas las IDs correspondientes
       * a indicadores expresados en L/km.
       */
      "L/km": [
        32, 20, 7
      ]
    };

    /*
     * Devuelve la unidad asociada a una ID.
     */
    function obtenerSimboloDesdeID(id) {
      for (const [simbolo, ids] of Object.entries(simbolosConfig)) {
        if (ids.includes(id)) {
          return simbolo;
        }
      }

      return "";
    }

    /*
     * Convierte el valor recibido desde Adalo en un número.
     *
     * Admite:
     * 1225
     * 1,225
     * 1.225
     * 12,25
     * 12.25
     */
    function obtenerNumero(parametro) {
      if (
        parametro === null ||
        parametro === undefined ||
        parametro === ""
      ) {
        return 0;
      }

      let valor = parametro
        .toString()
        .trim()
        .replace("%", "")
        .replace(/\s/g, "");

      /*
       * Coma como separador de miles:
       * 1,225 -> 1225
       */
      if (/^-?\d{1,3}(,\d{3})+$/.test(valor)) {
        valor = valor.replace(/,/g, "");
      }

      /*
       * Punto como separador de miles:
       * 1.225 -> 1225
       */
      else if (/^-?\d{1,3}(\.\d{3})+$/.test(valor)) {
        valor = valor.replace(/\./g, "");
      }

      /*
       * Coma decimal:
       * 12,25 -> 12.25
       */
      else {
        valor = valor.replace(",", ".");
      }

      const numero = Number.parseFloat(valor);

      return Number.isFinite(numero)
        ? numero
        : 0;
    }

    /*
     * Solo los indicadores L/km dividen entre 10.000.
     * Todos los demás dividen entre 100.
     */
    function obtenerDivisorDesdeID(id) {
      const simbolo =
        obtenerSimboloDesdeID(id);

      return simbolo === "L/km"
        ? 10000
        : 100;
    }

    /*
     * Los indicadores L/km muestran 4 decimales.
     * El resto muestra 2.
     */
    function obtenerDecimalesDesdeID(id) {
      const simbolo =
        obtenerSimboloDesdeID(id);

      return simbolo === "L/km"
        ? 4
        : 2;
    }

    /*
     * Obtiene y convierte los parámetros enviados desde Adalo.
     */
    function getValores() {
      const params =
        new URLSearchParams(window.location.search);

      const id =
        Number.parseInt(
          params.get("id"),
          10
        ) || null;

      const divisor =
        obtenerDivisorDesdeID(id);

      return {
        referencia:
          obtenerNumero(
            params.get("referencia")
          ) / divisor,

        seguimientoAnual:
          obtenerNumero(
            params.get("seguimientoAnual")
          ) / divisor,

        criterio:
          (
            params.get("criterio") || "AUM"
          )
            .trim()
            .toUpperCase(),

        id: id
      };
    }

    /*
     * Ajusta automáticamente el tamaño del número y la unidad
     * para ocupar correctamente el espacio disponible.
     */
    function ajustarTexto() {
      const contenedor =
        document.getElementById("contenedor");

      const contador =
        document.getElementById("contador");

      const valor =
        document.getElementById("valor");

      const unidad =
        document.getElementById("unidad");

      const anchoDisponible =
        Math.max(
          contenedor.clientWidth - 16,
          1
        );

      const altoDisponible =
        Math.max(
          contenedor.clientHeight - 16,
          1
        );

      /*
       * El número ocupa aproximadamente el 75 % de la altura.
       * La unidad se muestra algo más pequeña.
       */
      const tamanoValor =
        Math.min(
          altoDisponible * 0.72,
          210
        );

      const tamanoUnidad =
        Math.max(
          tamanoValor * 0.52,
          18
        );

      valor.style.fontSize =
        tamanoValor + "px";

      unidad.style.fontSize =
        tamanoUnidad + "px";

      contador.style.transform =
        "none";

      /*
       * Se fuerza el recálculo del tamaño real.
       */
      const anchoTexto =
        contador.scrollWidth;

      const altoTexto =
        contador.scrollHeight;

      const escalaAncho =
        anchoDisponible / anchoTexto;

      const escalaAlto =
        altoDisponible / altoTexto;

      const escala =
        Math.min(
          escalaAncho,
          escalaAlto,
          1
        );

      contador.style.transform =
        "scale(" + escala + ")";
    }

    /*
     * Aplica el color según el criterio:
     *
     * AUM:
     * valor mayor o igual que la referencia = verde.
     *
     * DIS:
     * valor menor o igual que la referencia = verde.
     */
    function aplicarColor(
      valor,
      referencia,
      criterio
    ) {
      const contador =
        document.getElementById("contador");

      if (criterio === "AUM") {
        contador.style.color =
          valor >= referencia
            ? "#85CD7B"
            : "#F19595";
      }

      else if (criterio === "DIS") {
        contador.style.color =
          valor <= referencia
            ? "#85CD7B"
            : "#F19595";
      }

      else {
        contador.style.color =
          "#607080";
      }
    }

    /*
     * Muestra el valor y la unidad.
     */
    function mostrarValor(
      valor,
      id
    ) {
      const elementoValor =
        document.getElementById("valor");

      const elementoUnidad =
        document.getElementById("unidad");

      const simbolo =
        obtenerSimboloDesdeID(id);

      const decimales =
        obtenerDecimalesDesdeID(id);

      elementoValor.textContent =
        valor.toFixed(decimales);

      elementoUnidad.textContent =
        simbolo;

      /*
       * Oculta el espacio de la unidad si no existe.
       */
      elementoUnidad.style.display =
        simbolo
          ? "inline"
          : "none";

      ajustarTexto();
    }

    /*
     * Animación del contador.
     */
    function animateCounter(
      valor,
      referencia,
      criterio,
      id
    ) {
      let valorActual = 0;
      let inicioAnimacion = null;

      const duracion = 1500;

      aplicarColor(
        valor,
        referencia,
        criterio
      );

      mostrarValor(
        0,
        id
      );

      if (valor === 0) {
        return;
      }

      /*
       * Curva ease-out para que la animación
       * comience rápida y termine suavemente.
       */
      function easeOutCubic(progreso) {
        return 1 - Math.pow(1 - progreso, 3);
      }

      function animar(timestamp) {
        if (inicioAnimacion === null) {
          inicioAnimacion = timestamp;
        }

        const tiempoTranscurrido =
          timestamp - inicioAnimacion;

        const progreso =
          Math.min(
            tiempoTranscurrido / duracion,
            1
          );

        valorActual =
          valor * easeOutCubic(progreso);

        mostrarValor(
          valorActual,
          id
        );

        if (progreso < 1) {
          window.requestAnimationFrame(animar);
        }

        else {
          mostrarValor(
            valor,
            id
          );
        }
      }

      window.requestAnimationFrame(animar);
    }

    const valores =
      getValores();

    animateCounter(
      valores.seguimientoAnual,
      valores.referencia,
      valores.criterio,
      valores.id
    );

    /*
     * Adalo puede modificar el tamaño del WebView
     * después de cargar la página.
     */
    window.addEventListener(
      "load",
      ajustarTexto
    );

    window.addEventListener(
      "resize",
      ajustarTexto
    );

    if ("ResizeObserver" in window) {
      const observador =
        new ResizeObserver(
          ajustarTexto
        );

      observador.observe(
        document.getElementById(
          "contenedor"
        )
      );
    }
  </script>

</body>
</html>
