<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Contador adaptable</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    #contenedor {
      width: 100%;
      height: 100%;
      padding: 2px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    #contador {
      display: inline-block;

      font-weight: 700;
      line-height: 1;
      text-align: center;
      white-space: nowrap;

      transform-origin: center center;

      text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
      transition: color 0.5s ease-in-out;
    }
  </style>
</head>

<body>

  <div id="contenedor">
    <div id="contador">0</div>
  </div>

  <script>
    /*
     * CONFIGURACIÓN DE UNIDADES
     *
     * Cuando crees o modifiques un indicador, añade aquí su ID
     * dentro de la unidad correspondiente.
     *
     * IMPORTANTE:
     * - Los IDs incluidos en "L/km" se dividirán entre 10.000
     *   y se mostrarán con 4 decimales.
     * - Todos los demás IDs se dividirán entre 100
     *   y se mostrarán con 2 decimales.
     */
    const simbolosConfig = {
      "%": [
        46, 45, 29, 28, 27, 17, 16, 15, 2, 1
      ],

      "kWh": [
        44, 43, 40, 39, 34, 33, 22, 21, 11, 10
      ],

      "m³/persona": [
        9, 41, 42
      ],

      "L/100 Tm": [
        31, 19, 5
      ],
	  
	  "kg": [
        8
      ],
	  
      /*
       * AÑADE AQUÍ todas las IDs de los indicadores
       * que deban expresarse en litros por kilómetro.
       */
      "L/km": [
        32, 20, 7
      ]
    };

    /*
     * Devuelve la unidad correspondiente a la ID recibida.
     */
    function obtenerSimboloDesdeID(id) {
      for (const [simbolo, ids] of Object.entries(simbolosConfig)) {
        if (ids.includes(id)) {
          return simbolo;
        }
      }

      return "";
    }

    /*
     * Convierte el valor recibido desde Adalo en un número.
     *
     * También corrige casos en los que Adalo envía separadores
     * de miles, por ejemplo:
     *
     * 1,225  -> 1225
     * 1.225  -> 1225
     * 1225   -> 1225
     */
    function obtenerNumero(parametro) {
      if (
        parametro === null ||
        parametro === undefined ||
        parametro === ""
      ) {
        return 0;
      }

      let valor = parametro
        .toString()
        .trim()
        .replace(/\s/g, "");

      /*
       * Formato de miles con coma:
       * 1,225 -> 1225
       */
      if (/^-?\d{1,3}(,\d{3})+$/.test(valor)) {
        valor = valor.replace(/,/g, "");
      }

      /*
       * Formato de miles con punto:
       * 1.225 -> 1225
       */
      else if (/^-?\d{1,3}(\.\d{3})+$/.test(valor)) {
        valor = valor.replace(/\./g, "");
      }

      /*
       * Coma decimal:
       * 12,25 -> 12.25
       */
      else {
        valor = valor.replace(",", ".");
      }

      const numero = Number.parseFloat(valor);

      return Number.isFinite(numero)
        ? numero
        : 0;
    }

    /*
     * Determina el divisor según la unidad asociada al ID.
     *
     * L/km:
     * Adalo 338 -> HTML 338 / 10000 = 0.0338 L/km
     *
     * Resto:
     * Adalo 800 -> HTML 800 / 100 = 8.00 %
     */
    function obtenerDivisorDesdeID(id) {
      const simbolo = obtenerSimboloDesdeID(id);

      return simbolo === "L/km"
        ? 10000
        : 100;
    }

    /*
     * Obtiene y convierte los parámetros enviados desde Adalo.
     */
    function getValores() {
      const params = new URLSearchParams(
        window.location.search
      );

      const id =
        Number.parseInt(params.get("id"), 10) || null;

      const divisor =
        obtenerDivisorDesdeID(id);

      return {
        referencia:
          obtenerNumero(
            params.get("referencia")
          ) / divisor,

        seguimientoAnual:
          obtenerNumero(
            params.get("seguimientoAnual")
          ) / divisor,

        criterio:
          (
            params.get("criterio") || "AUM"
          )
            .trim()
            .toUpperCase(),

        id: id
      };
    }

    /*
     * Ajusta el tamaño del texto al espacio disponible
     * dentro del WebView.
     */
    function ajustarTexto() {
      const contenedor =
        document.getElementById("contenedor");

      const contador =
        document.getElementById("contador");

      const anchoDisponible =
        Math.max(
          contenedor.clientWidth - 4,
          1
        );

      const altoDisponible =
        Math.max(
          contenedor.clientHeight - 4,
          1
        );

      /*
       * Se parte de un tamaño alto y se reduce
       * hasta que el texto cabe en el WebView.
       */
      let tamano =
        Math.min(
          altoDisponible * 0.8,
          150
        );

      contador.style.fontSize =
        tamano + "px";

      contador.style.transform =
        "none";

      const anchoTexto =
        contador.scrollWidth;

      const altoTexto =
        contador.scrollHeight;

      const escalaAncho =
        anchoDisponible / anchoTexto;

      const escalaAlto =
        altoDisponible / altoTexto;

      const escala =
        Math.min(
          escalaAncho,
          escalaAlto,
          1
        );

      contador.style.transform =
        "scale(" + escala + ")";
    }

    /*
     * Aplica el color según el criterio:
     *
     * AUM:
     * mayor o igual que la referencia = verde.
     *
     * DIS:
     * menor o igual que la referencia = verde.
     */
    function aplicarColor(
      valor,
      referencia,
      criterio
    ) {
      const contador =
        document.getElementById("contador");

      if (criterio === "AUM") {
        contador.style.color =
          valor >= referencia
            ? "#85CD7B"
            : "#F19595";
      }

      else if (criterio === "DIS") {
        contador.style.color =
          valor <= referencia
            ? "#85CD7B"
            : "#F19595";
      }

      else {
        /*
         * Criterio no reconocido:
         * se utiliza un color neutro.
         */
        contador.style.color =
          "#666666";
      }
    }

    /*
     * Número de decimales:
     *
     * L/km -> 4 decimales.
     * Resto -> 2 decimales.
     */
    function obtenerDecimalesDesdeID(id) {
      const simbolo =
        obtenerSimboloDesdeID(id);

      return simbolo === "L/km"
        ? 4
        : 2;
    }

    /*
     * Muestra el valor con su unidad.
     */
    function mostrarValor(
      valor,
      id
    ) {
      const contador =
        document.getElementById("contador");

      const simbolo =
        obtenerSimboloDesdeID(id);

      const decimales =
        obtenerDecimalesDesdeID(id);

      contador.textContent =
        valor.toFixed(decimales) +
        (
          simbolo
            ? " " + simbolo
            : ""
        );

      ajustarTexto();
    }

    /*
     * Animación del contador.
     */
    function animateCounter(
      valor,
      referencia,
      criterio,
      id
    ) {
      let currentValue = 0;

      const pasos = 100;
      const duracion = 2000;
      const intervalo =
        duracion / pasos;

      const incremento =
        valor / pasos;

      aplicarColor(
        valor,
        referencia,
        criterio
      );

      mostrarValor(
        0,
        id
      );

      if (valor === 0) {
        return;
      }

      const animation =
        setInterval(() => {
          currentValue += incremento;

          if (
            incremento >= 0 &&
            currentValue >= valor
          ) {
            currentValue = valor;
            clearInterval(animation);
          }

          if (
            incremento < 0 &&
            currentValue <= valor
          ) {
            currentValue = valor;
            clearInterval(animation);
          }

          mostrarValor(
            currentValue,
            id
          );
        }, intervalo);
    }

    const valores =
      getValores();

    animateCounter(
      valores.seguimientoAnual,
      valores.referencia,
      valores.criterio,
      valores.id
    );

    /*
     * Adalo puede recalcular el tamaño del WebView
     * después de cargar la página.
     */
    window.addEventListener(
      "load",
      ajustarTexto
    );

    window.addEventListener(
      "resize",
      ajustarTexto
    );

    if ("ResizeObserver" in window) {
      const observador =
        new ResizeObserver(
          ajustarTexto
        );

      observador.observe(
        document.getElementById(
          "contenedor"
        )
      );
    }
  </script>

</body>
</html>
